[Debug]
; Explicit opt-in sidecar. Remove this file to return to normal default DLAA.
Enabled=1
; F8 records eight recognized resolve intervals or at most eight seconds.
Resolves=8
TimeoutMs=8000
; Only triggers an already loaded RenderDoc instance, never injects one.
RenderDoc=1
RenderDocFrames=2
; Optional native queue submission/fence metadata. Keep 0 with GPU capture tools.
QueueTrace=0
; Optional local disassembly of selected shaders; review before sharing.
ShaderDisasm=0
