[SR]
; Explicit opt-in. Match actual game/render sizes and restart after edits.
Enabled=0
Render=auto
Output=1920x1080
Quality=quality
HDR=0
Jitter=1
Preset=default

; Optional experimental calibration: defaults retain the validated path.
HUD=native
DepthInverted=0
MVJittered=0
MVScaleX=1
MVScaleY=1
PreExposure=1
ExposureScale=1

; Experimental dynamic anisotropic-wrap texture bias. off / auto / -2.5..0
LodBias=off
